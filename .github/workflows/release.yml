# 설치판 — 태그 v* 를 올리면 윈도우 · 맥에서 묶고(3-코드/packaging/build.py) 자체 시험 후 GitHub 릴리스에 올린다.
#   윈도우 Trace-Setup-<버전>.exe · 맥 Trace-<버전>-mac.dmg (Apple 칩) · 크롬 확장 Trace-<버전>-extension.zip
#   git tag v0.1.0 && git push origin v0.1.0
# 손으로 돌리거나(Actions → 설치판 → Run workflow) PC 앱 코드를 바꾼 PR 이면 릴리스 없이 묶기·시험만 (결과물은 Artifacts).
# 서버 /download 와 PC 앱의 새 버전 알림은 "최신 릴리스" 를 읽는다 (사전 릴리스는 안 보임).
name: 설치판

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "3-코드/packaging/**"
      - "3-코드/app/**"
      - "3-코드/collector/**"
      - "3-코드/core/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 3-코드/packaging/requirements-build.txt

      - name: 라이브러리
        run: python -m pip install -r "3-코드/packaging/requirements-build.txt"

      - name: Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: 묶기 · 자체 시험 · 설치 파일
        run: python "3-코드/packaging/build.py"

      - uses: actions/upload-artifact@v4
        with:
          name: Trace-windows
          path: |
            3-코드/packaging/dist/*.exe
            3-코드/packaging/dist/*.zip

  mac:
    runs-on: macos-latest                       # Apple 칩 (arm64) — 인텔 맥은 아직
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 3-코드/packaging/requirements-build.txt

      - name: 라이브러리
        run: python -m pip install -r "3-코드/packaging/requirements-build.txt"

      # 같은 인증서로 서명해야 업데이트해도 맥 권한(손쉬운 사용 · 입력 모니터링)이 안 풀린다 (10/14 · build.py 맥_dmg)
      # 릴리스(태그)는 비밀값 MAC_SIGN_P12 · MAC_SIGN_PASSWORD 가 꼭 있어야 함 — 없으면 멈춤 (임시 서명으로 내보내면 모두 권한이 풀림)
      # PR · 손으로 돌림은 비밀값이 없으면 그때만 쓰는 인증서로 서명해 본다 (서명 길이 되는지 시험 · 릴리스엔 안 씀)
      - name: 서명 인증서
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/sign.p12"
          if [ -n "$MAC_SIGN_P12" ]; then
            printf %s "$MAC_SIGN_P12" | base64 --decode > "$P12"
            PW="$MAC_SIGN_PASSWORD"
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::비밀값 MAC_SIGN_P12 가 없어요 — 3-코드/packaging/맥_서명_준비.command 를 한 번 돌려 주세요"
            exit 1
          else
            echo "::notice::비밀값이 없어 이번만 쓰는 인증서로 서명해 봄 (시험용)"
            PW=$(/usr/bin/openssl rand -hex 16)
            /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/k.pem" -out "$RUNNER_TEMP/c.pem" \
              -config "3-코드/packaging/mac-sign.cnf"
            /usr/bin/openssl pkcs12 -export -inkey "$RUNNER_TEMP/k.pem" -in "$RUNNER_TEMP/c.pem" -name "Trace Code Signing" \
              -out "$P12" -passout "pass:$PW"
          fi
          KC="$RUNNER_TEMP/trace-sign.keychain-db"
          KCPW=$(/usr/bin/openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$P12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12" "$RUNNER_TEMP/k.pem"
          ID=$(security find-identity -p codesigning "$KC" | awk '/\)/ {print $2; exit}')
          [ -n "$ID" ] || { echo "::error::인증서를 키체인에서 못 찾음"; exit 1; }
          echo "TRACE_MAC_SIGN_ID=$ID" >> "$GITHUB_ENV"
          echo "TRACE_MAC_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: 묶기 · 자체 시험 · .dmg
        run: python "3-코드/packaging/build.py"

      - uses: actions/upload-artifact@v4
        with:
          name: Trace-mac
          path: 3-코드/packaging/dist/*.dmg

  release:
    # 두 빌드가 다 되면 한 번에 올린다 (따로 올리면 릴리스가 둘로 만들어질 수 있음)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          name: Trace ${{ github.ref_name }}
          body_path: 3-코드/packaging/notes/${{ github.ref_name }}.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
