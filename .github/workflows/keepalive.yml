# 인터넷 서버 깨워 두기 — Render 무료 요금제는 15분 동안 요청이 없으면 잠들고, 깨우는 첫 요청이 30초~1분 걸린다
# (그동안 Trace 앱에 "서버에 연결하지 못했습니다"). 10분마다 상태 주소를 한 번 불러 잠들지 않게 한다 (10/14).
#   · 무료: Render 무료 750시간/월 = 서비스 하나를 한 달 내내 켜 두기에 충분
#   · ⚠ GitHub 예약 실행은 늦는다 — 10/14~19 실제로는 10분이 아니라 2~5시간에 한 번 돌았다 (그 사이 서버는 잠듦).
#     늘 깨워 두려면 바깥 감시 서비스(UptimeRobot · cron-job.org 무료 · 5분마다)를 /api/health 에 걸어 둔다 (server/README.md)
#   · 잠든 서버가 깨는 데 40초~1분 넘게 · 그동안 Render 가 502 를 줄 때가 있다 → 5분까지 기다린다 (10/19 · 1분만 보고 실패 메일이 왔음)
#     5분 넘게 응답이 없을 때만 실패 — 그땐 정말 서버 문제라 메일이 와야 한다
#   · 저장소에 60일 동안 활동이 없으면 GitHub 이 예약을 멈춘다
#   · 손으로 깨우기: Actions → 서버 깨워 두기 → Run workflow
name: 서버 깨워 두기

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 상태 주소 부르기
        run: |
          i=0
          while [ $SECONDS -lt 300 ]; do
            i=$((i + 1))
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://trace-server-8aa0.onrender.com/api/health || true)
            echo "시도 $i (${SECONDS}초): HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::5분 넘게 서버가 응답하지 않음 — Render 대시보드의 Logs · Events 를 확인"; exit 1
