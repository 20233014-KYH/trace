<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설정 · Trace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/work.css">
<style>
/* 설정 — 캔버스 곁가지 · 설정 6칸 (10/13): 왼쪽 작은 목록 · 누르면 그 칸 하나만
   ★ 원문 기록은 끌 수 없음 · 서버 주소는 안 보임 · 점수·퍼센트 없음 */
.body{flex:1;min-height:0;overflow:auto;display:flex;gap:28px;padding:24px 32px}
.left{display:flex;flex-direction:column;gap:14px;flex:none}
.left h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;padding-left:10px}
.snav{width:184px;display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--ink);text-decoration:none}
.snav a:hover{background:var(--soft)}.snav a.on{background:#efeff1;font-weight:500}
.right{flex:1;min-width:0;max-width:760px;display:flex;flex-direction:column;gap:14px;padding-top:42px}
.sc{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.sc .hd{display:flex;align-items:center;gap:8px}.sc .hd .btn{margin-left:auto}
.sc .sub{margin-top:-4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:0}
.row .tt{flex:1;min-width:0}.row .tt b{display:block;font-size:14px;font-weight:500}.row .tt .desc{font-size:12.5px}
.row .k{width:92px;flex:none;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k.w{width:150px}
.row .v{flex:1;min-width:0;font-size:14px}
.row.dim .tt b{color:var(--muted)}
.sw{width:32px;height:18px;border-radius:999px;background:#e4e4e7;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sw[aria-checked=true]{background:var(--ink)}.sw[aria-checked=true]::after{left:16px}
.sw:disabled{opacity:.45;cursor:default}
select.in{height:32px;padding:0 8px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px var(--line);font:inherit;font-size:13px;color:var(--ink);background:#fff}
.in{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
.in:focus{outline:none;border-color:var(--edit-d);box-shadow:0 0 0 3px rgba(62,99,221,.12)}
.chks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.chk{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.chk .ico{width:32px;height:32px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:#52525b}
.chk b{font-size:14px;font-weight:500;display:block}.chk .desc{font-size:12.5px}
.chk .r{display:flex;align-items:center;gap:6px}
.badge svg{width:12px;height:12px;stroke-width:2.2}
.badge.amber{background:#fffbeb;color:#b45309;border-color:#fde68a}
.help{font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.soon{font-size:11px;color:var(--faint);margin-left:6px;font-weight:400}
.toast{font-size:13px;padding:9px 12px;border-radius:10px;background:#eaf0fd;color:#2f50c4}
.toast.err{background:#fdecec;color:#a4282d}
.form{display:flex;flex-direction:column;gap:8px;padding:8px 0 4px}
.form .acts{display:flex;gap:8px}
.red{color:#c62f34}
.anno{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;border:1px dashed #a1a1aa;font-size:11px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="mark"><i></i><i></i><i></i></span><b>Trace</b>
      <button class="tg" id="b-rail" title="메뉴 접기" aria-label="메뉴 접기" aria-expanded="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
    <a class="nav" href="/home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="t">홈</span></a>
    <a class="nav" href="/review"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="t">돌아보기</span></a>
    <a class="nav on" href="/settings" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="t">설정</span></a>
    <h4>내 과제</h4>
    <nav class="works" id="works"></nav>
    <a class="nav add" href="/new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">새 과제</span></a>
    <div class="me" id="me"></div>
  </aside>

  <main class="main">
    <header class="top pywebview-drag-region">
      <div class="tl">
        <button class="ib arw" id="b-back" title="홈" aria-label="홈으로"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
        <button class="ib arw" id="b-fwd" disabled title="앞으로" aria-label="앞으로"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 18l6-6-6-6"/></svg></button>
        <div class="crumb"><a href="/settings">설정</a>/<b id="c-tab">기록</b></div>
      </div>
      <div></div>
      <div class="win">
        <button data-w="min" title="최소화" aria-label="최소화"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button data-w="max" title="최대화" aria-label="최대화"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button data-w="close" class="x" title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
    </header>

    <div class="body">
      <div class="left"><h1>설정</h1><nav class="snav" id="snav"></nav></div>
      <div class="right" id="right"><div class="desc">불러오는 중…</div></div>
    </div>
  </main>
</div>

<script src="/ui/shell.js"></script>
<script src="/ui/win.js"></script>
<script>
(function () {
  const T = window.TraceShell, $ = id => document.getElementById(id), el = T.el;
  const TABS = [
    ["record", "기록", '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'],
    ["window", "기록 창", '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>'],
    ["report", "내역서 기본값", '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>'],
    ["account", "계정", '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'],
    ["data", "내 데이터", '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>'],
    ["app", "앱 정보", '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>'],
  ];
  const IC = {
    ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    minus: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
    lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    app: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
    doc: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
    folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  };
  const POS = { br: "오른쪽 아래", bl: "왼쪽 아래", tr: "오른쪽 위", tl: "왼쪽 위" };
  let tab = new URLSearchParams(location.search).get("tab") || "record";
  if (!TABS.some(t => t[0] === tab)) tab = "record";
  let d = null;

  T.init({});
  T.loadWorks(null, { stay: true });
  $("b-back").onclick = () => location.href = "/home";

  function nav() {
    const n = $("snav"); n.textContent = "";
    TABS.forEach(([k, name, ic]) => {
      const a = el("a", k === tab ? "on" : ""); a.href = "?tab=" + k; a.append(T.icon(ic), document.createTextNode(name));
      a.onclick = e => { e.preventDefault(); tab = k; history.replaceState(null, "", "?tab=" + k); draw(); };
      n.append(a);
    });
    $("c-tab").textContent = TABS.find(t => t[0] === tab)[1];
    document.title = `${TABS.find(t => t[0] === tab)[1]} · 설정 · Trace`;
  }

  // ── 작은 부품 ──
  function card(title, sub, right) {
    const c = el("section", "card sc"), h = el("div", "hd"); h.append(el("span", "h-sec", title)); if (right) h.append(right);
    c.append(h); if (sub) c.append(el("div", "desc sub", sub)); return c;
  }
  function row(title, sub, ctl, cls) {
    const r = el("div", "row" + (cls ? " " + cls : "")), t = el("div", "tt"), b = el("b", null, title);
    t.append(b); if (sub) t.append(el("div", "desc", sub)); r.append(t); if (ctl) r.append(ctl); return r;
  }
  function kv(k, v, ctl, sub, wide) {
    const r = el("div", "row"), kk = el("span", "k" + (wide ? " w" : ""), k); kk.title = k;
    const vv = el("div", "v"); if (v instanceof Node) vv.append(v); else vv.textContent = v; if (sub) vv.append(el("div", "desc", sub));
    r.append(kk, vv); if (ctl) r.append(ctl); return r;
  }
  function sw(key, soon) {
    const b = el("button", "sw"); b.setAttribute("role", "switch"); b.setAttribute("aria-checked", String(!!d.prefs[key]));
    if (soon) { b.disabled = true; b.title = "준비 중"; return b; }
    b.onclick = () => save({ [key]: !d.prefs[key] });
    return b;
  }
  function sel(key, label) {
    const s = el("select", "in");
    d.choices[key].forEach(v => { const o = new Option(label(v), v); s.append(o); });
    s.value = String(d.prefs[key]);
    s.onchange = () => save({ [key]: isNaN(+s.value) ? s.value : +s.value });
    return s;
  }
  function lock() { const b = el("span", "badge gray"); b.append(T.icon(IC.lock), document.createTextNode("늘 켜짐")); return b; }
  function btn(text, cls, on) { const b = el("button", "btn btn-sm " + (cls || "btn-outline"), text); b.type = "button"; if (on) b.onclick = on; return b; }
  function toast(box, t, ok) { box.querySelectorAll(".toast").forEach(x => x.remove()); if (t) box.prepend(el("div", "toast" + (ok ? "" : " err"), t)); }
  const mb = n => n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))}KB` : `${(n / 1048576).toFixed(1)}MB`;

  async function save(ch) {
    try { d.prefs = (await T.call("POST", "/local/settings", null, ch)).prefs; draw(); }
    catch (e) { toast($("right"), e.message, false); }
  }

  // ── 칸 ──
  const TAB = {
    record() {
      const c1 = card("기록할 곳", "", btn("다시 확인", "btn-outline", load));
      c1.querySelector(".btn").prepend(T.icon(IC.refresh));
      const g = el("div", "chks"), ic = { chrome: IC.globe, edge: IC.globe, gptapp: IC.app, claudeapp: IC.app, word: IC.doc };
      let 도움 = false;
      d.checks.forEach(x => {
        const r = el("div", "chk"), i = el("span", "ico"); i.append(T.icon(ic[x.key]));
        const t = el("div"); t.append(el("b", null, x.name), el("span", "desc", x.desc));
        const right = el("div", "r"), bg = el("span", "badge " + ({ ok: "green", missing: "amber", none: "gray", unknown: "gray" })[x.state]);
        bg.append(T.icon(x.state === "ok" ? IC.ok : x.state === "missing" ? IC.warn : IC.minus), document.createTextNode(x.label));
        right.append(bg);
        if (x.state === "missing") { 도움 = true; right.append(btn("설치", "btn-outline", () => help.hidden = !help.hidden)); }
        r.append(i, t, right); g.append(r);
      });
      c1.append(g);
      const help = el("div", "help");
      help.hidden = true;
      help.innerHTML = "<b>확장 설치 (개발판)</b> · 그 브라우저 주소창에 <b>chrome://extensions</b> (엣지는 <b>edge://extensions</b>) → 개발자 모드 켜기 → "
        + "<b>압축해제된 확장 프로그램을 로드</b> → <b>Trace/3-코드/extension</b> 폴더 → 이 화면에서 [다시 확인]";
      if (도움) c1.append(help);
      const c2 = card("이 PC 에 남는 것", "출처를 찾는 데 꼭 필요해서 끌 수 없어요. 기록하고 싶지 않을 땐 기록 창의 잠깐 멈춤 — 그동안은 아무것도 남지 않아요");
      [["AI 질문 · 답", "어느 답에서 왔는지 찾는 재료 · 이 PC 에만"], ["과제 글이 바뀌는 과정", "붙여넣고 고친 문장을 가르는 재료 · 이 PC 에만"],
       ["복사한 AI 답 일부", "앱에서 복사한 글이 \"다른 곳\" 으로 잘못 가지 않게 · 이 PC 에만"],
       ["자동 가리기", "API 키 · 주민번호 · 카드번호 · 이메일 · 전화번호는 저장하기 전에 ⟦가림⟧"]].forEach(([a, b]) => c2.append(row(a, b, lock())));
      return [c1, c2];
    },
    window() {
      const c = card("기록 창", "과제하는 동안 화면 구석에 떠 있는 작은 창 · 기록 · 잠깐 멈춤 · 작업 마치기 · 바꾼 것은 다음에 기록 창을 켤 때부터");
      const soon = t => { const b = el("b"); b.append(document.createTextNode(t), el("span", "soon", "준비 중")); return b; };
      const r1 = row("", "과제에 붙인 파일일 때만 · 아니요를 누르면 그 파일은 다시 안 물어요", sw("ask_on_open", true), "dim");
      r1.querySelector("b").replaceWith(soon('Word 파일을 열면 "이 과제 기록할까요?" 묻기'));
      const r5 = row("", "켜기만 해요 · 기록은 과제를 고른 뒤에 시작", sw("autostart", true), "dim");
      r5.querySelector("b").replaceWith(soon("윈도우를 켜면 Trace 도 켜기"));
      c.append(r1, row("기록 시간 보이기", "끄면 파란 점만 · 시간은 내역서에 그대로 남아요", sw("show_time")),
               row("기록 창 자리", "끌어서 옮겨도 돼요 · 다음에 켤 때 이 자리", sel("position", v => POS[v])),
               row("입력이 없으면 쉬는 중으로 봄", "그동안은 기록 시간에서 빼요 · 잠깐 멈춤과는 따로", sel("idle_min", v => `${v}분`)), r5);
      return [c];
    },
    report() {
      const c = card("내역서 기본값", "과제를 처음 내보낼 때의 값이에요 · 과제마다 내보내기 화면에서 바꿀 수 있어요");
      c.append(row("교수 링크 기간", "기간이 지나면 링크가 열리지 않아요", sel("link_days", v => `${v}일`)),
               row("교수 링크에 출처 보기", "보고서 전문 + 문장마다 출처 · 켜면 보고서 전문이 서버로 가요", sw("with_source")),
               row("교수 링크에 작업 과정", "기록을 켜고 끈 날짜 · 시간 · 멈춤", sw("with_process")),
               row("개인 정보는 그 부분만 가리기", "내보낼 때 전화번호 · 이메일 같은 곳을 ⟦가림⟧ 으로", sw("mask_part")));
      return [c];
    },
    account() {
      const c = card("계정");
      if (!d.account) { c.append(el("div", "desc", "로그인하면 보여요"), (() => { const a = el("a", "btn btn-default btn-sm", "로그인"); a.href = "/login"; a.style.alignSelf = "flex-start"; return a; })()); return [c]; }
      const 이름 = kv("이름", d.account.name || "", btn("고치기", "btn-ghost", () => editName()), "내역서 맨 위에 나와요 — 교수가 누구 내역서인지 알 수 있게");
      const 비번 = kv("비밀번호", "••••••••", btn("바꾸기", "btn-ghost", () => editPw()));
      c.append(이름, kv("이메일", d.account.email || "", null, "로그인할 때 써요"), 비번,
               kv("이 PC", "한 번 로그인하면 다음부터 바로 열려요", btn("로그아웃", "btn-outline", async () => {
                 try { await T.call("POST", "/local/logout", null, {}); } catch (e) {} location.replace("/login");
               })));
      function editName() {
        const f = el("div", "form"), i = el("input", "in"); i.value = d.account.name || ""; i.maxLength = 40;
        const a = el("div", "acts"), ok = btn("저장", "btn-default", async () => {
          try { const r = await T.call("POST", "/local/account/name", null, { name: i.value.trim() }); d.account.name = r.name; draw(); toast($("right"), "이름을 바꿨어요. 다음에 만드는 내역서부터 이 이름이 나와요", true); T.loadWorks(null, { stay: true }); }
          catch (e) { toast(c, e.message, false); }
        });
        a.append(ok, btn("취소", "btn-outline", draw)); f.append(i, a);
        이름.querySelector(".v").replaceChildren(f); 이름.querySelector(".btn").remove(); i.focus();
      }
      function editPw() {
        const f = el("div", "form"), o = el("input", "in"), n = el("input", "in"), n2 = el("input", "in");
        [[o, "지금 비밀번호", "current-password"], [n, "새 비밀번호 (8자 이상)", "new-password"], [n2, "새 비밀번호 한 번 더", "new-password"]].forEach(([x, p, ac]) => { x.type = "password"; x.placeholder = p; x.autocomplete = ac; });
        const a = el("div", "acts"), ok = btn("바꾸기", "btn-default", async () => {
          if (n.value !== n2.value) { toast(c, "새 비밀번호 두 칸이 달라요", false); return; }
          try { await T.call("POST", "/local/account/password", null, { password: o.value, new_password: n.value }); draw(); toast($("right"), "비밀번호를 바꿨어요. 다른 기기에서는 다시 로그인해야 해요", true); }
          catch (e) { toast(c, e.message, false); }
        });
        a.append(ok, btn("취소", "btn-outline", draw)); f.append(o, n, n2, a);
        비번.querySelector(".v").replaceChildren(f); 비번.querySelector(".btn").remove(); o.focus();
      }
      return [c];
    },
    data() {
      const c = card("이 PC 에 쌓인 기록", "AI 질문 · 답 원문과 과제 글은 이 PC 에만 있어요");
      const open = btn("폴더 열기", "btn-outline", async () => { try { await T.call("POST", "/local/settings/open-folder", null, {}); } catch (e) { toast(c, e.message, false); } });
      open.prepend(T.icon(IC.folder));
      const 기록수 = d.data.works.reduce((a, w) => a + w.sessions, 0);
      c.append(kv("모두", `${mb(d.data.total)} · 과제 ${d.data.works.length}개 · 기록 ${기록수}번`, open, null, true));
      d.data.works.forEach(w => c.append(kv(w.title, `${mb(w.bytes)} · 기록 ${w.sessions}번`, null, null, true)));
      if (d.data.other) c.append(el("div", "desc", `내 과제 목록에 없는 기록 ${d.data.other}개 (로그인 없이 만든 것)도 이 폴더에 있어요`));
      c.append(el("div", "desc", "과제 하나를 지우려면 그 과제의 ⋯ → 과제 삭제 (준비 중)"));
      const c2 = card("계정 지우기", "", el("span", "anno", "준비 중 · 서버 기능 필요"));
      const del = btn("계정 지우기", "btn-outline red"); del.disabled = true; del.prepend(T.icon(IC.trash));
      c2.append(row("", "과제 · 기록 · 링크를 모두 지워요. 이 PC 원문도 지워져요. 지운 사실과 시각만 남아요 (과제 삭제와 같은 규칙)", del));
      c2.querySelector(".row b").remove();
      return [c, c2];
    },
    app() {
      const c = card("앱 정보");
      const 다시 = el("a", "btn btn-ghost btn-sm", "열기"); 다시.href = "/welcome";
      c.append(kv("버전", `Trace ${d.version}`, null, "업데이트 확인은 설치판이 나오면 여기서"),
               kv("도움말", "처음 한 번 다시 보기 · 기록 준비 점검", 다시),
               kv("못 잡는 것", "휴대폰 · 다른 PC 에서 쓴 AI · 사진 · HWP", null, "출처 기록 없음은 \"직접 썼다\" 는 뜻이 아니에요"),
               kv("원문", "AI 질문 · 답과 과제 글은 이 PC 에만 · 내가 고른 것만 내역서 · 링크로 나가요"));
      return [c];
    },
  };

  function draw() {
    nav();
    const r = $("right"); r.textContent = "";
    if (!d) return;
    TAB[tab]().forEach(x => r.append(x));
  }

  async function load() {
    try { d = await T.call("GET", "/local/settings"); draw(); }
    catch (e) { $("right").textContent = ""; $("right").append(el("div", "toast err", e.message)); }
  }
  nav(); load();
})();
</script>
</body>
</html>
