<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>돌아보기 · Trace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/work.css">
<style>
/* 돌아보기 v2 — 캔버스 곁가지 (10/13): 내 기록에서 찾은 것 → 해 볼 것 → 다음 과제 목표 · 주별 쓰임새
   ★ 나만 봄 · 내역서 · 링크에 안 들어감 · 점수 · 등급 · 퍼센트 없음 · 규칙으로 찾음 (AI 안 씀) */
.body{flex:1;min-height:0;overflow:auto;display:flex;gap:16px;padding:22px 32px}
.main2{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.side2{width:360px;flex:none;display:flex;flex-direction:column;gap:14px;padding-top:58px}
.ttl{font-size:20px;font-weight:700;letter-spacing:-.02em}
.seg{display:inline-flex;height:32px;padding:3px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:500}
.seg button{padding:0 10px;border-radius:8px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tips{padding:4px 22px 6px;display:flex;flex-direction:column}
.tips .hd{display:flex;align-items:center;gap:8px;padding:14px 0 2px}
.tip{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--soft)}
.tip:last-child{border-bottom:0}
.tip .no{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--ink);color:#fff}
.tip .bd{flex:1;min-width:0}
.tip .t{display:flex;align-items:center;gap:8px}.tip .t b{font-size:14px;font-weight:600}.tip .t .btn{margin-left:auto}
.tip .fact{font-size:12.5px;margin-top:2px}
.tip .todo{font-size:13px;margin-top:6px}
.tip .ex{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--ink2)}
.tip .add{margin-top:10px}
.empty{padding:22px 0;text-align:center;color:var(--muted);font-size:13.5px}
.gl{padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft)}
.goal:last-of-type{border-bottom:0}
.cb{width:16px;height:16px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px #a1a1aa;margin-top:2px}
.cb.on{background:var(--ink);color:#fff;box-shadow:none}.cb svg{width:11px;height:11px;stroke-width:3}
.goal .gt{flex:1;min-width:0}.goal .gt b{display:block;font-size:13.5px;font-weight:500}.goal .gt .desc{font-size:12px}
.goal .x{color:var(--faint);width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.goal .x:hover{background:var(--soft);color:var(--ink)}.goal .x svg{width:13px;height:13px}
.wk2{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.cols{display:flex;gap:8px;height:130px;align-items:flex-end}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.col b{font-size:12px;font-weight:600}.col span{font-size:11.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden}.stack i{display:block;width:30px}
.lg{display:flex;gap:12px;font-size:11.5px;color:#52525b;flex-wrap:wrap}.lg span{display:inline-flex;align-items:center;gap:5px}.lg i{width:9px;height:9px;border-radius:2px}
.err{color:var(--copy-d);font-size:13px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="mark"><i></i><i></i><i></i></span><b>Trace</b>
      <button class="tg" id="b-rail" title="메뉴 접기" aria-label="메뉴 접기" aria-expanded="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
    <a class="nav" href="/home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="t">홈</span></a>
    <a class="nav on" href="/review" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="t">돌아보기</span></a>
    <a class="nav" href="/settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="t">설정</span></a>
    <h4>내 과제</h4>
    <nav class="works" id="works"></nav>
    <a class="nav add" href="/new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">새 과제</span></a>
    <div class="me" id="me"></div>
  </aside>

  <main class="main">
    <header class="top pywebview-drag-region">
      <div class="tl">
        <button class="ib arw" id="b-back" title="홈" aria-label="홈으로"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
        <button class="ib arw" id="b-fwd" disabled title="앞으로" aria-label="앞으로"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 18l6-6-6-6"/></svg></button>
        <div class="crumb"><b>돌아보기</b></div>
      </div>
      <div></div>
      <div class="win" style="align-items:center">
        <div class="seg" id="seg" style="margin-right:8px"></div>
        <button data-w="min" title="최소화" aria-label="최소화"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button data-w="max" title="최대화" aria-label="최대화"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button data-w="close" class="x" title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
    </header>

    <div class="body">
      <div class="main2" id="m"></div>
      <div class="side2" id="s"></div>
    </div>
  </main>
</div>

<script src="/ui/shell.js"></script>
<script src="/ui/win.js"></script>
<script>
(function () {
  const T = window.TraceShell, $ = id => document.getElementById(id), el = T.el;
  const PERIODS = [["week", "이번 주"], ["month", "이번 달"], ["term", "이번 학기"]];
  const COL = { learn: "#d4d4d8", fix: "#71717a", write: "#18181b" }, NAME = { learn: "이해·자료 찾기", fix: "고치기·검토", write: "작성" };
  const IC = { plus: '<path d="M5 12h14"/><path d="M12 5v14"/>', check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' };
  const PRIV = "나만 보는 화면 · 내역서와 공유 링크에 들어가지 않음 · 점수 아님";
  let period = new URLSearchParams(location.search).get("period") || "month", d = null;

  T.init({});
  T.loadWorks(null, { stay: true });
  $("b-back").onclick = () => location.href = "/home";

  function seg() {
    const s = $("seg"); s.textContent = "";
    PERIODS.forEach(([k, t]) => { const b = el("button", k === period ? "on" : "", t); b.onclick = () => { period = k; history.replaceState(null, "", "?period=" + k); load(); }; s.append(b); });
  }

  async function goal(key, action) {
    try { await T.call("POST", "/local/review/goal", null, { key, action }); load(); } catch (e) { alert(e.message); }
  }

  function draw() {
    const m = $("m"), s = $("s"); m.textContent = ""; s.textContent = "";
    const h = el("div"); h.append(el("div", "ttl", `${d.name} 돌아보기`), el("div", "desc", `과제 ${d.works}개 · 질문 ${d.questions}개 · ${PRIV}`));
    m.append(h);

    // ① 내 기록에서 찾은 것
    const c = el("section", "card tips"), hd = el("div", "hd");
    hd.append(el("span", "h-sec", "내 기록에서 찾은 것"), el("span", "desc", d.tips.length ? `해 볼 만한 것 ${d.tips.length}개 · 규칙으로 찾음` : "규칙으로 찾음"));
    c.append(hd);
    if (!d.questions) c.append(el("div", "empty", "이 기간에 기록한 질문이 없어요. 과제를 기록하면 여기서 돌아볼 수 있어요."));
    else if (!d.tips.length) c.append(el("div", "empty", "이 기간엔 따로 해 볼 만한 것을 찾지 못했어요. 지금처럼 쓰면 돼요."));
    d.tips.forEach((t, i) => {
      const r = el("div", "tip"), bd = el("div", "bd"), tt = el("div", "t"); tt.append(el("b", null, t.title));
      if (t.link) { const a = el("a", "btn btn-ghost btn-sm", "그 문장 보기"); a.href = t.link; tt.append(a); }
      bd.append(tt, el("div", "desc fact", t.fact), el("div", "todo", "→ " + t.todo));
      if (t.example) { const ex = el("div", "ex"); ex.append(el("span", "muted", "내 질문 예 · "), document.createTextNode(`"${t.example.text}" `), el("span", "muted", `— ${t.example.where}`)); bd.append(ex); }
      const 담김 = d.has_goal.includes(t.key);
      const add = el("button", "btn btn-outline btn-sm add", 담김 ? "목표에 담겨 있어요" : "다음 과제 목표로 담기");
      if (!담김) { add.prepend(T.icon(IC.plus)); add.onclick = () => goal(t.key, "add"); } else add.disabled = true;
      bd.append(add); r.append(el("span", "no", String(i + 1)), bd); c.append(r);
    });
    m.append(c);

    // ② 다음 과제 목표
    const g = el("section", "card gl"), gh = el("div", "hd"); gh.style.display = "flex"; gh.style.gap = "8px";
    gh.append(el("span", "h-sec", "다음 과제 목표"), el("span", "desc", "내가 고른 것"));
    g.append(gh);
    if (!d.goals.length) g.append(el("div", "desc", "왼쪽에서 [다음 과제 목표로 담기] 를 누르면 여기에 생겨요"));
    d.goals.forEach(x => {
      const r = el("div", "goal"), cb = el("button", "cb" + (x.done ? " on" : "")); cb.title = x.done ? "다시 하기" : "해냈어요";
      if (x.done) cb.append(T.icon(IC.check)); cb.onclick = () => goal(x.key, x.done ? "undo" : "done");
      let sub = "다음 과제부터 셈";
      if (x.after != null) sub = `${x.after_title} · ${x.label} ${x.before != null ? x.before + " → " : ""}${x.after}`;
      const t = el("div", "gt"); t.append(el("b", null, x.text), el("div", "desc", sub));
      const del = el("button", "x"); del.title = "목표에서 빼기"; del.append(T.icon(IC.x)); del.onclick = () => goal(x.key, "remove");
      r.append(cb, t, del); g.append(r);
    });
    g.append(el("div", "desc", "새 과제를 기록하면 여기서 바뀐 것을 보여 줘요"));
    s.append(g);

    // ③ 주별 쓰임새
    const w = el("section", "card wk2"); w.append(el("span", "h-sec", "어떻게 썼나 · 주별"));
    if (!d.weeks.length) w.append(el("div", "desc", "아직 기록이 없어요"));
    else {
      const mx = Math.max(...d.weeks.map(x => x.learn + x.fix + x.write)), cols = el("div", "cols");
      d.weeks.forEach(x => {
        const col = el("div", "col"), st = el("div", "stack");
        ["learn", "fix", "write"].forEach(k => { if (x[k]) { const i = el("i"); i.style.height = (x[k] / mx * 92) + "px"; i.style.background = COL[k]; st.append(i); } });
        col.append(el("b", null, String(x.learn + x.fix + x.write)), st, el("span", null, x.label)); cols.append(col);
      });
      const lg = el("div", "lg");
      Object.keys(NAME).forEach(k => { const sp = el("span"), i = el("i"); i.style.background = COL[k]; sp.append(i, document.createTextNode(`${NAME[k]} ${d.usage[k]}`)); lg.append(sp); });
      w.append(cols, lg, el("div", "desc", "개수만 · 점수 아님"));
    }
    s.append(w);
  }

  async function load() {
    seg();
    try { d = await T.call("GET", "/local/review?period=" + period); draw(); }
    catch (e) { if (e.code === 401) { location.replace("/login"); return; } $("m").textContent = ""; $("m").append(el("div", "err", e.message)); }
  }
  load();
})();
</script>
</body>
</html>
