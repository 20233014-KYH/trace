<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Trace</title>
<style>
/* 목업 13·13b·13c 의 CSS. 창은 투명(DWM) — 그림자는 회색 얼룩이 되므로 뺐다. 모션 없음 (9/22 결정) */
html,body{margin:0;background:transparent;font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:12px;color:#1c1f24;overflow:hidden;user-select:none}
#root{position:fixed;right:4px;bottom:4px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{width:160px;box-sizing:border-box;display:flex;align-items:center;gap:7px;height:26px;padding:0 8px 0 9px;background:rgba(28,31,36,.92);color:#fff;border-radius:13px;font-size:11px;font-variant-numeric:tabular-nums;cursor:grab}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#7c3aed;flex:none}.pill.learn .dot{background:#0ea5e9}
.pill .t{font-weight:700}.pill .n{color:#bfc4cc;margin-left:auto}
.pill .stop{width:14px;height:14px;border-radius:50%;border:1.5px solid #9ca3af;display:flex;align-items:center;justify-content:center;margin-left:2px;cursor:pointer;flex:none}
.pill .stop i{width:6px;height:6px;background:#e5e7eb;border-radius:1px;display:block}
.pill .stop:hover{border-color:#fff}
.pill.mini{width:26px;padding:0;justify-content:center}.pill.mini .t,.pill.mini .n,.pill.mini .stop{display:none}
.ask{width:160px;height:28px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 4px 0 9px;background:#fff;border:1px solid #b9bfc7;border-radius:14px;color:#9ca3af;cursor:text}
.ask .ic{width:14px;height:14px;border-radius:50%;background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ask .ph{flex:1}
.send{margin-left:auto;width:20px;height:20px;border-radius:50%;background:#0ea5e9;color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;cursor:pointer}
.panel{width:360px;height:392px;background:#fff;border:1px solid #7dd3fc;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.panel .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f0f9ff;border-bottom:1px solid #bae6fd;font-size:13px;font-weight:700;color:#0369a1;cursor:grab}
.panel .hd .x{margin-left:auto;border:0;background:none;color:#6b7280;font-size:14px;cursor:pointer}
.panel .msgs{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;overflow:auto;user-select:text}
.panel .me{align-self:flex-end;max-width:88%;background:#0ea5e9;color:#fff;padding:8px 11px;border-radius:12px 12px 2px 12px;white-space:pre-wrap}
.panel .ai{max-width:92%;background:#fff;border:1px solid #e5e7eb;padding:9px 11px;border-radius:12px 12px 12px 2px;line-height:1.55;white-space:pre-wrap}
.panel .ai.err{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.panel .note{color:#9ca3af;font-size:11.5px;margin:0}
.panel .in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e5e7eb;align-items:flex-end}
.panel textarea{flex:1;border:1px solid #e5e7eb;border-radius:9px;padding:7px 11px;font:inherit;font-size:12.5px;resize:none;min-height:34px;max-height:100px;outline:none;user-select:text}
.panel .in .send{width:30px;height:30px;font-size:14px}
.hidden{display:none!important}
</style></head>
<body>
<div id="root">
  <!-- 펼친 패널 (Learn · 질문칸 클릭 시) -->
  <div id="panel" class="panel hidden">
    <div class="hd pywebview-drag-region"><span style="width:7px;height:7px;border-radius:50%;background:#0ea5e9"></span>Learn AI · 물어보기<button class="x" id="close" title="닫기 (Esc)">✕</button></div>
    <div class="msgs" id="msgs"><p class="note">이 세션의 최근 오류·질문을 근거로 답합니다. 대화는 세션 맥락으로 남아 리포트에 반영됩니다.</p></div>
    <div class="in"><textarea id="q" rows="1" placeholder="이어서 묻기…"></textarea><button class="send" id="send">↑</button></div>
  </div>
  <!-- 접힌 질문칸 (Learn 만) -->
  <div id="ask" class="ask hidden"><span class="ic">?</span><span class="ph">AI에게 물어보기…</span><button class="send">↑</button></div>
  <!-- 알약 -->
  <div id="pill" class="pill pywebview-drag-region"><span class="dot"></span><span class="t" id="t">00:00:00</span><span class="n" id="n"></span><span class="stop" id="stop" title="세션 마치기 (봉인)"><i></i></span></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let mode = "proof", mini = false, open = false, busy = false, first = true;

async function tick() {
  try {
    const s = await pywebview.api.status();
    mode = s.mode;
    $("pill").classList.toggle("learn", mode === "learn");
    $("t").textContent = s.recording ? s.elapsed : "봉인 중…";
    $("n").textContent = mode === "learn" ? `맥락 ${s.ctx_count}` : `${s.events}건`;
  } catch (e) { /* api 준비 전 */ }
}
// 창 크기와 보이는 것 — 한 번에. (단계별 애니메이션은 WebView 가 튀어서 뺐음)
async function layout() {
  const name = open ? "open" : mini ? "mini" : mode === "learn" ? "learn" : "pill";
  $("panel").classList.toggle("hidden", !open);
  $("ask").classList.toggle("hidden", open || mini || mode !== "learn");
  $("pill").classList.toggle("mini", mini && !open);
  await pywebview.api.layout(name, first); first = false;
}
window.addEventListener("pywebviewready", async () => { await tick(); await layout(); setInterval(tick, 1000); });

// 알약 클릭(드래그 아님) → 최소 모드 토글
let downAt = null;
$("pill").addEventListener("mousedown", (e) => { downAt = [e.screenX, e.screenY]; });
$("pill").addEventListener("mouseup", (e) => {
  if (e.target.closest("#stop")) return;
  if (downAt && Math.hypot(e.screenX - downAt[0], e.screenY - downAt[1]) < 4) { mini = !mini; layout(); }
  downAt = null;
});
$("stop").addEventListener("click", async () => { $("t").textContent = "봉인 중…"; await pywebview.api.stop(); });

// 질문칸 → 패널
$("ask").addEventListener("click", async () => { open = true; await layout(); $("q").focus(); });
$("close").addEventListener("click", () => { open = false; layout(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && open) { open = false; layout(); } });

function add(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("msgs").appendChild(d); $("msgs").scrollTop = 1e9; return d; }
async function send() {
  const t = $("q").value.trim();
  if (!t || busy) return;
  $("q").value = ""; busy = true;
  add("me", t);
  const wait = add("ai", "답변 생성 중…");
  const r = await pywebview.api.chat(t);
  wait.remove();
  if (r.error) add("ai err", r.error); else add("ai", r.answer || "(빈 답)");
  busy = false; $("q").focus();
}
$("send").addEventListener("click", send);
$("q").addEventListener("keydown", (e) => { if (e.isComposing) return; if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body></html>
