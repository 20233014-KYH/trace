<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출처 보기 · Trace</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/ui/shell.css">
<style>
/* 출처 보기 — 캔버스 "Trace 화면 뼈대" 4 · 4 AI 답 기준 · 4 메뉴 접음 (1차 확정 10/11)
   흑연(zinc) · Pretendard · 색 결정 C: AI 답과 같음 · 다른 곳에서 옴 = 빨강 바탕 (10/12 이름 바꿈 · 보면서 똑같이 쳐도 빨강) · 고침 = 파랑 바탕 · 보고 씀 = 파랑 점선 밑줄 · 출처 기록 없음 = 거의 안 보이는 회색
   ★ 점수·퍼센트 없음. 보기만 하는 화면 — 맞다/아니다는 다음 단계(연결 확인). */

/* 도구 줄 */
.bar{display:flex;align-items:center;gap:14px;padding:16px 24px 12px;flex:none;min-width:0}
.seg{display:inline-flex;background:#ececee;border-radius:10px;padding:3px;flex:none}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.lg{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink2);white-space:nowrap;min-width:0;overflow:hidden}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg b{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.lg .sw{width:10px;height:10px;border-radius:3px}
.lg .stat b{color:var(--ink);font-weight:700}
.u{text-decoration:underline dashed var(--edit-d);text-decoration-thickness:1.5px;text-underline-offset:4px}
.right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.pos{font-size:13px;color:var(--muted);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.btn{height:30px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;font-weight:600}
.btn:hover{background:var(--soft)}.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filt{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:#fff;padding:2px}
.filt button{height:26px;padding:0 9px;border-radius:7px;font-size:13px;color:var(--muted)}
.filt button.on{background:var(--soft);color:var(--ink);font-weight:600}

/* 본문: 왼쪽 큰 칸 + 오른쪽 자세히 */
.body{flex:1;min-height:0;display:flex;gap:16px;padding:0 24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;border-bottom:0}
.doc{flex:1;min-width:0;overflow:auto;scrollbar-gutter:stable}
.doc-in{max-width:720px;margin:0 auto;padding:28px 36px 60px}
.file{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:18px}
.file svg{width:14px;height:14px}
.file{position:relative}
/* 문서 바꾸기 → 파일 이름 밑에 이 과제에서 기록된 문서 목록 */
.fbtn{margin-left:auto;display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 6px 0 8px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.fbtn:hover,.fbtn[aria-expanded=true]{background:var(--soft);color:var(--ink)}
.fbtn svg{width:14px;height:14px;transition:transform .15s}.fbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.fmenu{position:absolute;left:-8px;top:calc(100% + 6px);z-index:5;width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(24,24,27,.10);padding:6px}
.fmenu h6{margin:6px 8px 4px;font-size:12px;font-weight:500;color:var(--muted)}
.fmenu button{display:flex;width:100%;align-items:center;gap:8px;min-height:34px;padding:6px 8px;border-radius:8px;font-size:13.5px;color:var(--ink);text-align:left}
.fmenu button:hover{background:var(--soft)}
.fmenu button svg{width:15px;height:15px;color:var(--muted)}
.fmenu .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmenu small{color:var(--faint);font-size:11.5px;white-space:nowrap}
.fmenu .ck{color:var(--ink)}
.fmenu .sep{height:1px;background:var(--soft);margin:4px 2px}
.fmenu .other{color:var(--muted)}
.fmenu .hint{margin:2px 8px 6px;color:var(--muted)}
.pickhint{margin:-10px 0 16px;color:var(--ink2)}
.fwarn{display:flex;gap:8px;align-items:flex-start;margin:-6px 0 18px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13px;color:var(--ink2);line-height:1.55}
.fwarn b{font-weight:600;color:var(--ink)}
.fwarn svg{width:16px;height:16px;margin-top:2px;color:var(--muted)}
.fwarn.info{background:#eef3fe;color:#2f4fb5}.fwarn.info b{color:#2f50c4}.fwarn.info svg{color:#3e63dd}
.doc h1{font-size:20px;font-weight:700;margin:0 0 16px;letter-spacing:-.01em}
.para{margin:0 0 14px;font-size:15px;line-height:2;color:var(--ink)}
.para.head{font-size:16px;font-weight:700;margin:22px 0 10px;line-height:1.6}
.s{border-radius:3px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:2px 0}
.s.copy{background:var(--copy)}.s.edited{background:var(--edit)}
.s.viewed{text-decoration:underline dashed var(--edit-d);text-decoration-thickness:1.5px;text-underline-offset:5px}
.s.none{background:var(--none)}
.s:hover{filter:brightness(.97)}
/* 고른 문장 = 같은 색을 진하게 (테두리는 줄마다 끊겨 지저분함) */
.s.copy.on{background:#f8cfd0}.s.edited.on{background:#cddbfa}
.s.viewed.on{background:#eef3fe;text-decoration-thickness:2px}.s.none.on{background:#e9e9ec}
.tag{font-size:10.5px;font-weight:600;padding:0 4px;margin:0 3px;border-radius:3px;vertical-align:2px;background:#fff;border:1px solid var(--line);color:var(--ink2);white-space:nowrap;line-height:1.5;display:none}
.labels .tag{display:inline}

.empty{max-width:440px;margin:90px auto;text-align:center;color:var(--muted);font-size:14px}
.empty h2{color:var(--ink);font-size:17px;margin:0 0 6px}
.drop{margin-top:18px;border:1.5px dashed #d4d4d8;border-radius:14px;padding:26px 18px;background:#fff}
.drop.over{border-color:var(--ink);background:var(--soft)}
.drop .btn{height:36px;padding:0 16px;margin-top:10px}
.hint{font-size:12.5px;color:var(--faint);margin-top:10px}
.err{color:var(--copy-d)}

/* 오른쪽 칸 = 자세히(굴러감) + 맨 아래 다음 단계 버튼(고정) */
.rp{width:340px;flex:none;display:flex;flex-direction:column;min-height:0}
.rp-f{flex:none;padding:12px 20px 16px;border-top:1px solid var(--soft)}
.det{flex:1;min-height:0;overflow:auto;padding:22px 20px 24px;display:flex;flex-direction:column;gap:6px;scrollbar-gutter:stable}
.det>*{flex:none}
.det .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.det .ttl i{width:8px;height:8px;border-radius:50%;flex:none}
.det .sub{font-size:13px;color:var(--muted);margin-top:-2px}
.det h5{margin:14px 0 2px;font-size:12.5px;font-weight:500;color:var(--muted)}
.det .txt{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.det .box{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.det .ans{max-height:340px;overflow:auto;position:relative}
.det .ans.focus .g-copy{background:#fef5f5}.det .ans.focus .g-edited{background:#f4f7fe}.det .ans.focus .g-viewed{text-decoration-color:#b9c9f4}
.det .ans .f.g-copy{background:#f8cfd0}.det .ans .f.g-edited{background:#cddbfa}.det .ans .f.g-viewed{background:#eef3fe;text-decoration-color:var(--edit-d);text-decoration-thickness:2px}
.det .ans .g-copy{background:var(--copy);border-radius:2px}.det .ans .g-edited{background:var(--edit);border-radius:2px}
.det .ans .g-viewed{text-decoration:underline dashed var(--edit-d);text-decoration-thickness:1.5px;text-underline-offset:4px}
.det .src{font-size:13px;color:var(--ink2);margin-top:2px}.det .src b{font-weight:600;color:var(--ink)}
.det .note{font-size:12.5px;color:var(--muted)}
.det .placeholder{color:var(--faint);font-size:13.5px;margin:auto;text-align:center}
.uses{display:flex;flex-direction:column}
.uses button{display:grid;grid-template-columns:10px auto minmax(0,1fr);gap:8px;align-items:center;text-align:left;font-size:13px;padding:6px 0;border-top:1px solid var(--soft)}
.uses button:hover .ut{text-decoration:underline}
.uses .sq{width:9px;height:9px;border-radius:2px}
.uses .ul{color:var(--muted);white-space:nowrap}
.uses .ut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uses .more{display:block;border:0;font-size:12.5px;color:var(--muted);text-align:left;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.go{align-self:flex-start;margin-top:12px}

/* AI 답 기준 */
.ql{flex:1;min-width:0;display:flex;flex-direction:column}
.ql-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding:16px 24px 6px}
.ql-h span{display:inline-flex;align-items:center;gap:6px}
.ql-h i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ql-list{flex:1;min-height:0;overflow:auto;padding:4px 12px 8px;scrollbar-gutter:stable}
.qrow{display:grid;grid-template-columns:44px 14px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:8px 12px;border-radius:10px;cursor:pointer;position:relative}
.qrow:hover{background:#f7f7f8}.qrow.on{background:var(--soft)}
.qrow .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qrow .pt{width:9px;height:9px;border-radius:50%;background:var(--ink);justify-self:center;position:relative;z-index:1}
.qrow .pt.ref{background:#fff;box-shadow:inset 0 0 0 1.5px var(--faint)}
.qrow:not(:last-child)::after{content:"";position:absolute;left:68px;top:50%;height:100%;width:1px;background:#e4e4e7}
.qrow .qm small{display:block;font-size:11.5px;color:var(--faint);line-height:1.3}
.qrow .qm div{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow.on .qm div{font-weight:600}
.qrow .qm div.none{color:var(--faint)}
.chips{display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;line-height:1.7}
.chip.copy{background:var(--copy);color:#c62a2f}.chip.edited{background:var(--edit);color:#2f4fb5}
.chip.viewed{border:1px solid #c6d4f7;color:#2f4fb5}.chip.viewed span{text-decoration:underline dashed;text-underline-offset:3px}
.chip.ref{border:1px solid var(--line);color:var(--ink2);font-weight:500}
.chips .pp{font-size:12px;color:var(--muted)}
.ql-f{font-size:12.5px;color:var(--muted);padding:10px 24px 14px;border-top:1px solid var(--soft)}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="mark"><i></i><i></i><i></i></span><b>Trace</b>
      <button class="tg" id="b-rail" title="메뉴 접기" aria-label="메뉴 접기" aria-expanded="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
    <a class="nav" href="/home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="t">홈</span></a>
    <a class="nav" href="/review"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="t">돌아보기</span></a>
    <a class="nav" href="/settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="t">설정</span></a>
    <h4>내 과제</h4>
    <nav class="works" id="works"></nav>
    <a class="nav add" href="/new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">새 과제</span></a>
    <div class="me" id="me"></div>
  </aside>

  <main class="main">
    <header class="top pywebview-drag-region">
      <div class="tl">
      <button class="ib arw" id="b-back" title="뒤로" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
      <button class="ib arw" id="b-fwd" title="앞으로" aria-label="앞으로"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 18l6-6-6-6"/></svg></button>
      <div class="crumb"><a href="/home">내 과제</a>/<a id="c-work">과제</a>/<b>출처 보기</b></div>
      </div>
      <div class="steps" aria-label="단계">
        <span class="done"><i></i>기록</span><em></em><span class="cur" data-s="source"><i></i>출처 보기</span><em></em><span data-s="confirm"><i></i>연결 확인</span><em></em><span data-s="report"><i></i>내역서</span>
      </div>
      <div class="win">
        <button data-w="min" title="최소화" aria-label="최소화"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button data-w="max" title="최대화" aria-label="최대화"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button data-w="close" class="x" title="닫기" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
    </header>

    <div class="bar">
      <div class="seg" role="tablist">
        <button role="tab" class="on" id="t-doc">문서 기준</button>
        <button role="tab" id="t-ai">AI 답 기준</button>
      </div>
      <div class="lg" id="lg-doc"></div>
      <div class="lg" id="lg-ai" hidden></div>
      <div class="right" id="r-doc">
        <button class="ib box" id="b-up" title="앞 출처 (↑)" aria-label="앞 출처"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
        <button class="ib box" id="b-down" title="다음 출처 (↓)" aria-label="다음 출처"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="pos" id="pos">–</span>
        <button class="btn" id="b-labels" aria-pressed="false">글자로 표시</button>
      </div>
      <div class="right" id="r-ai" hidden>
        <div class="filt" id="filt"><button class="on" data-f="all">전체</button><button data-f="used">글이 들어간 답</button><button data-f="ref">참고만</button></div>
      </div>
    </div>

    <div class="body">
      <section class="card doc" id="v-doc"><div class="doc-in" id="doc"></div></section>
      <section class="card ql" id="v-ai" hidden>
        <div class="ql-h"><span id="ql-meta"></span><span><i style="background:var(--ink)"></i>글이 들어감 <i style="background:#fff;box-shadow:inset 0 0 0 1.5px var(--faint);margin-left:8px"></i>참고만</span></div>
        <div class="ql-list" id="qlist" role="listbox"></div>
        <div class="ql-f">참고만 한 답도 기록에 남습니다 — 이해하고 확인하는 데 쓴 과정도 보여 줄 수 있어요.</div>
      </section>
      <aside class="card rp">
        <div class="det" id="det"><div class="placeholder">왼쪽에서 색칠된 문장을 누르면<br>어디서 왔는지 여기 보입니다</div></div>
        <div class="rp-f"><a class="next" id="b-next" href="/confirm">다음: 연결 확인</a></div>
      </aside>
    </div>
  </main>
</div>
<input type="file" id="pick" accept=".docx,.pdf" hidden>

<script src="/ui/shell.js"></script>
<script src="/ui/win.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const KIND = { exact: "AI 답과 일치", similar: "AI 답과 유사", edited: "붙여넣고 고침", viewed: "AI 답 보고 씀",
                 web: "다른 곳에서 붙여넣음", noproc: "쓴 과정 기록 없음", none: "출처 기록 없음" };
  const SHORT = { exact: "일치", similar: "유사", edited: "고침", viewed: "보고 씀", web: "다른 곳", noproc: "과정 없음", none: "" };
  const 앱이름 = { "claude.exe": "Claude 앱", "chatgpt.exe": "ChatGPT 앱", "chrome.exe": "Chrome", "msedge.exe": "Edge", "whale.exe": "웨일", "firefox.exe": "Firefox" };
  const 받은곳 = p => p.domain || 앱이름[(p.app || "").toLowerCase()] || p.app || "";         // 받은 사이트 · 없으면 앱
  const 짧게 = x =>x.kind === "noproc" && x.proc && x.proc.how === "download" ? "받은 파일" : SHORT[x.kind];   // 기록 중 받은 결과물 파일 (10/15)
  const GROUP = { copy: "AI 답과 같음", edited: "고침", viewed: "보고 씀", none: "출처 기록 없음" };
  const DOT = { copy: "var(--copy-d)", edited: "var(--edit-d)", viewed: "var(--edit-d)", none: "#d4d4d8" };
  const wid = new URLSearchParams(location.search).get("work") || "";
  let D = null, cur = -1, tab = "doc", qcur = -1, filt = "all", works = [];

  // 화면 틀(왼쪽 메뉴 · 위 줄 · 과제 목록)은 shell.js — 연결 확인 화면과 같이 씀
  const { call, el, hm, md, svgFile } = TraceShell;
  TraceShell.init({ wid, step: "source" });
  async function loadWorks() { works = await TraceShell.loadWorks(wid); }

  // ── 과제 파일 ──
  function askFile(err, files) {
    const box = $("doc"); box.textContent = "";
    const e = el("div", "empty");
    e.append(el("h2", null, "과제 파일을 골라 주세요"),
             el("div", null, "Word(.docx) · PDF 파일 문장마다 어디서 왔는지 이 PC 기록과 이어서 보여 줍니다. 파일은 이 PC 밖으로 나가지 않습니다."));
    const d = el("div", "drop");
    d.append(el("div", null, "여기에 끌어다 놓거나"));
    const b = el("button", "btn", "파일 고르기"); b.onclick = () => $("pick").click(); d.append(b);
    if (files && files.length) d.append(el("div", "hint", "이 과제를 기록할 때 연 문서: " + files.join(" · ")));
    e.append(d);
    if (err) e.append(el("div", "hint err", err));
    box.append(e);
    d.ondragover = ev => { ev.preventDefault(); d.classList.add("over"); };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = ev => { ev.preventDefault(); d.classList.remove("over"); if (ev.dataTransfer.files[0]) load(ev.dataTransfer.files[0]); };
  }
  $("pick").onchange = () => { if ($("pick").files[0]) load($("pick").files[0]); $("pick").value = ""; };

  async function load(file) {
    if (!wid) return;
    const fd = new FormData(); fd.append("work_id", wid); if (file) fd.append("file", file);
    if (file) { $("doc").innerHTML = ""; $("doc").append(el("div", "empty", "기록과 잇는 중…")); }
    try { D = await call("POST", "/local/source", fd); }
    catch (e) {
      if (e.code === 400 && e.data && e.data.error === "no_file") return askFile("", e.data.files);
      return askFile(e.message);
    }
    render();
  }

  // ── 문서 바꾸기: 이 과제에서 기록된 문서 목록 (기록엔 이름만 있어서, 누르면 그 파일을 고르는 창을 연다) ──

  // ── 그리기 ──

               `${[받은곳(g), g.ts && `${md(g.ts)} ${hm(g.ts)}`].filter(Boolean).join(" · ")}에 받은 파일${g.name ? "(" + g.name + ")" : ""}과 내용이 똑같아요.`);

      w.append(icon('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>'), t); box.append(w);

    D.paragraphs.forEach(p => {

      p.sents.forEach((k, i) => {
        const x = D.sentences[k];
        const s = el("span", "s " + x.group, x.text);
        s.dataset.k = k; s.tabIndex = -1;
        s.onclick = () => pick(k, false);

        if (짧게(x)) para.append(el("span", "tag", 짧게(x)));
        if (i < p.sents.length - 1) para.append(" ");
      });
      box.append(para);
    });
    qlist();
    nav = D.sentences.filter(x => x.group !== "none").map(x => x.k);
    cur = -1; $("pos").textContent = nav.length ? `– / ${nav.length}` : "0";
    if (nav.length) pick(nav[0], true); else detail(null);
  }
  let nav = [];

  function pick(k, scroll) {
    document.querySelectorAll(".s.on").forEach(e => e.classList.remove("on"));
    const s = document.querySelector(`.s[data-k="${k}"]`);
    if (s) { s.classList.add("on"); if (scroll) s.scrollIntoView({ block: "center", behavior: "smooth" }); }
    cur = k;
    const i = nav.indexOf(k);
    $("pos").textContent = nav.length ? `${i < 0 ? "–" : i + 1} / ${nav.length}` : "0";
    detail(D.sentences[k]);
  }
  function step(d) {
    if (!nav.length) return;

    if (i < 0) { i = nav.findIndex(k => k > cur); if (d < 0) i = (i < 0 ? nav.length : i) - 1; else if (i < 0) i = 0; i = Math.max(0, i); }
    else i = Math.min(nav.length - 1, Math.max(0, i + d));
    pick(nav[i], true);
  }
  $("b-up").onclick = () => step(-1);
  $("b-down").onclick = () => step(1);
  document.addEventListener("keydown", e => {
    if (!D || e.target.closest("input,textarea")) return;
    if (tab === "doc" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); step(e.key === "ArrowDown" ? 1 : -1); }
    if (tab === "ai" && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      const vis = shownQs(); let i = vis.indexOf(qcur) + (e.key === "ArrowDown" ? 1 : -1);

  });
  $("b-labels").onclick = () => {

  };

  function pieces(box, parts, focus) {
    // focus = 지금 고른 결과물 문장에 이어진 답 문장 번호들 → 그 부분만 진하게, 나머지 쓰인 곳은 옅게
    let first = null;
    parts.forEach(p => {
      if (!p.g) return box.append(p.t);
      const on = focus && focus.includes(p.i);

    });

  }
  function into(box, sp) {      // 원문 상자 안에서 그 부분이 가운데 오게 (상자가 그려진 뒤)

  function toolLine(q) { return [q.tool, q.model].filter(Boolean).join(" · "); }

    $("t-doc").classList.toggle("on", t === "doc"); $("t-ai").classList.toggle("on", t === "ai");
    $("t-doc").setAttribute("aria-selected", t === "doc"); $("t-ai").setAttribute("aria-selected", t === "ai");
    ["v-doc", "lg-doc", "r-doc"].forEach(id => $(id).hidden = t !== "doc");
    ["v-ai", "lg-ai", "r-ai"].forEach(id => $(id).hidden = t !== "ai");
    if (!D) return;
    if (t === "ai") { const vis = shownQs(); if (vis.length) qpick(vis.includes(qcur) ? qcur : vis[0], false); else $("det").textContent = ""; }
    else if (cur >= 0) pick(cur, false); else detail(null);
  }
  $("t-doc").onclick = () => show("doc");
  $("t-ai").onclick = () => { if (D) show("ai"); };

  loadWorks().then(() => { if (wid) load(null); else askFile(""); });
})();
</script>
</body>
