<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Trace — 창작 과정 증명</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <div>
      <h1>Trace</h1>
      <p class="sub">창작 과정 증명 · 검증 화면</p>
    </div>
    <button id="verifyBtn">다시 검증</button>
  </header>

  <!-- ① 판정 — 검증자가 맨 먼저 보는 것 -->
  <section id="verdict" class="verdict"></section>

  <!-- ② 한 줄 요약 -->
  <section id="overview"></section>

  <!-- ③ 작품 > 파일 > 세션 -->
  <section id="works"></section>

  <!-- ④ 작성 영역 — 작가만 쓴다. 접혀 있다. -->
  <section class="writer">
    <button id="toggleWriter" class="toggle">▸ 작성 영역 열기</button>

    <div id="writerBody" hidden>
      <div class="fields">
        <label>
          작품
          <input id="workTitle" type="text" value="기록은 왜 증거가 되는가">
        </label>
        <label>
          파일
          <input id="fileName" type="text" value="초고.docx">
        </label>
      </div>
      <p class="hint">
        같은 작품 이름으로 다시 시작하면 그 작품에 이어서 쌓입니다.
        증명서는 작품 하나에 한 장 나옵니다.
      </p>

      <div class="btns">
        <button id="startBtn">기록 시작</button>
        <button id="saveBtn" class="ghost" disabled>지금 저장</button>
        <button id="stopBtn" class="ghost" disabled>기록 종료</button>
      </div>

      <textarea id="editor" placeholder="기록을 시작하면 여기에 쓸 수 있습니다." disabled></textarea>

      <div class="status">
        <span id="statusText" class="muted">대기 중</span>
        <span id="counters" class="muted"></span>
      </div>
    </div>
  </section>

  <footer>
    <p><strong>이 화면이 보증하는 것</strong> — 기록이 작성된 뒤 고쳐지지 않았다는 사실.</p>
    <p><strong>보증하지 않는 것</strong> — 본인이 직접 작업했는지 여부. AI 사용 여부를 판정하지 않습니다.
       어떤 파일을 한 작품으로 묶을지는 작성자가 정합니다. 해석은 보는 사람의 몫입니다.</p>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
