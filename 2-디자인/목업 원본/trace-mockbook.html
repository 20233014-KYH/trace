<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Trace 목업북 v0.3</title>
<!--
  ─────────────────────────────────────────────────────────────────────
  Trace 목업북 v0.3 · 디자이너 전달용 · 2026-09-19
  한 파일에 모든 화면. ?screen=ID 로 한 장씩 열림. build.py 가 PNG/PDF 로 뽑아 폴더 구조로 저장.

  화면 ID (build.py 의 SCREENS 와 같아야 함)
   overview  전체 흐름과 화면 원칙 (개요 페이지)
   changes   기획 변화 정리 (PDF)
   s01 모드선택 · s02 첫실행-수집동의(예정)
   s03 기록중-알약 · s04 알약-hover · s05 봉인확인 · s06 봉인완료(예정)
   s07 내기록-한눈에 · s08 내기록-체인원본 · s09 검증결과(예정)
   s10 증명서-내보내기옵션(예정) · s11 증명서-문서 · s12 검증자-웹(예정)
   s13 Learn-타임라인(예정) · s14 Learn-공유설정(예정)

  ▶ 수정: :root 색 · DATA · 각 화면 함수(HTML 문자열) · META(제목·설명·칩)
  ─────────────────────────────────────────────────────────────────────
-->
<style>
  :root{
    --page:#f3f4f7; --win:#fff; --win-bar:#f3f4f6; --line:#e5e7eb; --ink:#1c1f24; --muted:#6b7280; --soft:#f9fafb;
    --brand:#5b4ddb; --proof:#7c3aed; --learn:#0ea5e9; --rec:#ef4444; --ok:#10b981; --warn:#f59e0b;
    --g-typed:#10b981; --g-del:#9ca3af; --g-paste-ai:#ef4444; --g-paste:#f59e0b; --g-undo:#7c3aed;
    --c-resource:#3b82f6; --c-work:#10b981; --c-ai:#f59e0b; --c-other:#cbd5e1;
    --font:"Pretendard","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --mono:Consolas,"Cascadia Mono","JetBrains Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--page);font-size:14px;line-height:1.55}
  /* 문서 헤더 (참고 형식) */
  .doc{width:1400px;padding:22px 28px 30px}
  .doc .hd{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .doc .num{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--brand);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--mono)}
  .doc .num.p{border-color:var(--proof);color:var(--proof)}.doc .num.l{border-color:var(--learn);color:var(--learn)}
  .doc h1{font-size:24px;margin:0;letter-spacing:-.01em}
  .doc .desc{color:var(--muted);font-size:15px;margin:2px 0 14px 42px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid;font-family:var(--mono);letter-spacing:-.01em}
  .chip.new{border-color:#a7f3d0;background:#ecfdf5;color:#047857}
  .chip.todo{border-color:#c7d2fe;background:#eef2ff;color:#4338ca}
  .chip.chg{border-color:#fde68a;background:#fffbeb;color:#b45309}
  .chip.keep{border-color:#e5e7eb;background:#fff;color:#6b7280}
  .frame{border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.06);background:#fff;border:1px solid #dfe2e7}
  /* 데스크톱 배경 (알약·다이얼로그 맥락용) */
  .desk{position:relative;width:1344px;height:760px;overflow:hidden;background:radial-gradient(1200px 600px at 30% 20%,#eef1f5 0,#dfe3e8 60%,#d3d8de 100%)}
  .taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;background:#f4f5f7;border-top:1px solid #d5d9de;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;gap:14px;color:var(--muted);font-size:12px}
  .tray{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;background:#fff;border:1px solid var(--line)}
  .tray .dot{width:8px;height:8px;border-radius:50%;background:var(--rec)}
  /* 앱 창 */
  .win{background:var(--win);display:flex;flex-direction:column}
  .win.float{position:absolute;border:1px solid #c9ced5;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
  .bar{height:40px;background:var(--win-bar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;flex:none}
  .bar .name{font-weight:700}.bar .name small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
  .bar .ctl{margin-left:auto;display:flex;gap:18px;color:#6b7280;font-size:12px}
  .body{flex:1;overflow:hidden}
  /* 브라우저 창 */
  .browser .bar{gap:8px}.browser .dots i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#d1d5db;margin-right:5px}
  .browser .url{margin-left:8px;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-family:var(--mono);font-size:12px;color:var(--muted);background:#fff}
  /* 공통 */
  h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}h3{font-size:16px;margin:0 0 8px}h4{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.01em}
  .sub{color:var(--muted);margin:0}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;font-weight:500}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.proof{background:var(--proof);border-color:var(--proof);color:#fff}
  .btn.danger{color:#b91c1c;border-color:#fecaca}
  .btn.sm{padding:6px 12px;font-size:13px}
  .badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;white-space:nowrap}
  .badge.proof{background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9}.badge.learn{background:#e0f2fe;border-color:#bae6fd;color:#0369a1}
  .badge.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.badge.wait{background:#fffbeb;border-color:#fde68a;color:#b45309}
  .mono{font-family:var(--mono);font-size:13px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line)}.kv:first-child{border-top:0}.kv b{font-weight:600;text-align:right}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
  .callout{background:#f0f9ff;border:1px solid #bae6fd;color:#0c4a6e;border-radius:12px;padding:12px 16px;font-size:13.5px}
  .warn{padding:12px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;color:#92400e}
  .sw{position:relative;width:44px;height:24px;border-radius:12px;background:#d1d5db;border:0;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff}
  .sw.on{background:var(--ok)}.sw.on::after{left:22px}
  .sw.lock{background:var(--proof);opacity:.55}
  .row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
  .row .t{flex:1}.row .t b{display:block;font-size:14px}.row .t span{font-size:12.5px;color:var(--muted)}
  /* 모드 선택 */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0 18px}
  .mode{border:2px solid var(--line);border-radius:14px;padding:22px;position:relative;background:#fff}
  .mode.on{border-color:var(--proof);background:#faf8ff;box-shadow:0 0 0 4px #ede9fe}
  .mode .tag{position:absolute;top:14px;right:14px}
  .mode .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
  .mode.p .ic{background:#ede9fe}.mode.l .ic{background:#e0f2fe}
  .mode h3{margin:0 0 4px;font-size:18px}
  .mode .d{color:var(--muted);font-size:13.5px;min-height:42px}
  .mode ul{margin:12px 0 0;padding:0;list-style:none;font-size:13.5px}
  .mode li{padding:6px 0;border-top:1px dashed var(--line)}.mode li::before{content:"·";margin-right:6px;color:var(--muted)}
  /* 알약 */
  .pill{position:absolute;right:14px;bottom:52px;height:26px;display:flex;align-items:center;gap:7px;padding:0 8px 0 9px;background:rgba(28,31,36,.92);color:#fff;border-radius:13px;font-size:11px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 2px rgba(239,68,68,.35)}
  .pill.learn .dot{background:var(--learn);box-shadow:0 0 0 2px rgba(14,165,233,.35)}
  .pill .t{font-weight:600}.pill .n{color:#9ca3af}
  .pill .stop{width:14px;height:14px;border-radius:4px;border:1px solid #4b5563;display:flex;align-items:center;justify-content:center;margin-left:2px}.pill .stop i{width:6px;height:6px;background:#e5e7eb;border-radius:1px;display:block}
  .pop{position:absolute;right:14px;bottom:86px;width:240px;background:#fff;border:1px solid #c9ced5;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px 12px;font-size:11.5px}
  .pop .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}.pop .r b{color:var(--ink);font-weight:600}
  .pop .h{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .pop .a{display:flex;gap:6px;margin-top:8px}.pop .a .btn{flex:1;padding:4px 6px;font-size:11px;border-radius:6px}
  .pop::after{content:"";position:absolute;right:26px;bottom:-6px;width:10px;height:10px;background:#fff;border-right:1px solid #c9ced5;border-bottom:1px solid #c9ced5;transform:rotate(45deg)}
  .ask{position:absolute;right:14px;bottom:84px;width:190px;height:28px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 4px 0 9px;background:#fff;border:1px solid #c9ced5;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.14);font-size:12px;color:#9ca3af}
  .ask .ic{width:14px;height:14px;border-radius:50%;background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .ask .send{margin-left:auto;width:20px;height:20px;border-radius:50%;background:#0ea5e9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .askpanel{position:absolute;right:14px;bottom:84px;width:360px;background:#fff;border:1px solid #7dd3fc;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
  .askpanel .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f0f9ff;border-bottom:1px solid #bae6fd;font-size:13px;font-weight:700;color:#0369a1}
  .askpanel .hd .x{margin-left:auto;color:#6b7280;font-weight:400;font-size:14px}
  .askpanel .msgs{padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;max-height:330px;overflow:auto}
  .askpanel .me{align-self:flex-end;max-width:88%;background:#0ea5e9;color:#fff;padding:8px 11px;border-radius:12px 12px 2px 12px}
  .askpanel .ai{max-width:92%;background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:12px 12px 12px 2px;line-height:1.55}
  .askpanel .in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .askpanel .in span{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--muted);font-size:12.5px}
  .zoom{position:absolute;left:24px;bottom:60px;background:#fff;border:1px solid #c9ced5;border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:12px;color:var(--muted)}
  .zoom .pill{position:static;transform:scale(2.2);transform-origin:left center;margin:14px 0 14px 4px;display:inline-flex}
  .dim{position:absolute;inset:0;background:rgba(20,22,26,.35)}
  .code{background:#1e1e1e;padding:18px 24px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#d4d4d4;height:100%}
  /* 내 기록 */
  .rec-layout{display:flex;min-height:100%}
  .side{width:250px;border-right:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;flex:none}
  .side .hd{padding:14px 16px 10px;font-weight:700;display:flex;align-items:center;gap:8px}.side .hd .badge{margin-left:auto}
  .sess{padding:12px 16px;border-top:1px solid var(--line)}
  .sess.on{background:#fff;border-left:3px solid var(--proof)}
  .sess .d{font-weight:600;font-size:13.5px}.sess .m{font-size:12px;color:var(--muted);margin-top:2px}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .ro{background:#f5f3ff;border-bottom:1px solid #ddd6fe;color:#5b21b6;padding:8px 22px;font-size:13px}
  .head{padding:16px 22px 0;display:flex;align-items:flex-start;gap:14px}.head .btns{margin-left:auto;display:flex;gap:8px}
  .tabs{display:flex;gap:2px;padding:12px 22px 0;border-bottom:1px solid var(--line)}
  .tabs span{padding:8px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs span.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
  .pane{padding:18px 22px 22px}
  .verify{padding:10px 22px;border-top:1px solid var(--line);background:var(--soft);font-size:13px;color:var(--muted);display:flex;gap:18px;align-items:center}
  /* 한눈에 v0.3 */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .hero .h{padding:18px 22px}
  .hero .h+.h{border-left:1px solid var(--line)}
  .hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:2px 0 4px}
  .hero .lbl{font-size:14px;font-weight:600}.hero .sm{font-size:13px;color:var(--muted)}
  .comp{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:14px 0 0}.comp i{display:block;height:100%}
  .comp-legend{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:8px}.comp-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff}
  .tile .k{font-size:13px;color:var(--muted);font-weight:600}.tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}.tile .v small{font-size:14px;font-weight:500;color:var(--muted)}.tile .h{font-size:12.5px;color:var(--muted);margin-top:2px}
  .lanes{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px 18px 8px;background:#fff}
  .lanes svg{width:100%;height:auto;display:block}
  .moments{margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .mom{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;background:#fff}
  .mom .t{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;padding-top:2px}
  .mom .x{font-size:13.5px}.mom .x b{font-weight:600}
  .mom .ic{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:600;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
  td{padding:7px 12px;border-bottom:1px solid #f1f2f4;vertical-align:top;white-space:nowrap}td.sum{white-space:normal}
  .t-window{color:#374151}.t-copy{color:#b45309}.t-paste{color:#b91c1c}.t-file{color:#047857}.t-keys{color:#047857}.t-undo{color:#6d28d9}.t-heartbeat{color:#9ca3af}
  .link{color:#9ca3af}
  .toggle{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13.5px;font-weight:600;margin-top:12px}
  .toggle .arr{color:var(--muted)}.toggle .cnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:12.5px}
  .toggle.open{border-radius:12px 12px 0 0}
  .flowbox{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:#fff;overflow:hidden}
  .flowbox td{padding:7px 12px}
  /* 증명서 문서 */
  .paper{width:794px;min-height:1123px;background:#fff;margin:0 auto;padding:52px 56px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12.5px;position:relative}
  .paper .top{display:flex;align-items:flex-start;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px}
  .paper .top .logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
  .paper h1{font-size:22px;margin:16px 0 4px}
  .paper .grid{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:12.5px;margin:12px 0}
  .paper .grid .k{color:var(--muted)}
  .paper .sec{margin-top:18px}.paper .sec h3{font-size:13.5px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .paper .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .paper .box{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .paper .qr{width:92px;height:92px;border:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:5px}
  .paper .qr i{background:#1c1f24;display:block}.paper .qr i.o{background:transparent}
  .paper .foot{position:absolute;left:56px;right:56px;bottom:34px;display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  .viewer{background:#e5e7eb;padding:24px 0}
  /* 개요 페이지 */
  .ov{width:1600px;padding:40px 48px 56px}
  .ov .crumb{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
  .ov h1{font-size:40px;margin:8px 0 6px;letter-spacing:-.02em}
  .ov .lead{font-size:17px;color:var(--muted);margin:0 0 26px}
  .ov .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:start}
  .ov .panel{background:#fff;border-radius:16px;padding:26px 28px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .ov .panel h2{font-size:20px;margin:0 0 14px}
  .ov .step{display:flex;gap:16px;padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}
  .ov .step:first-of-type{border-top:0}
  .ov .n{width:36px;height:36px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
  .ov .n.todo{background:#fff;color:var(--muted);border:1.5px dashed #c7cbd1}
  .ov .step .x{flex:1}.ov .step .x b{font-size:15px;display:block}.ov .step .x span{font-size:13px;color:var(--muted)}
  .ov .step .id{font-family:var(--mono);font-size:12px;color:var(--brand);white-space:nowrap;padding-top:4px}
  .ov .ph{font-size:12px;font-family:var(--mono);color:var(--muted);letter-spacing:.05em;margin:18px 0 4px}
  .ov ol{margin:0;padding:0;list-style:none}.ov ol li{display:flex;gap:12px;padding:8px 0;font-size:14px}
  .ov ol li .i{font-family:var(--mono);color:var(--brand);font-size:12.5px;padding-top:3px;flex:none}
  .ov .lg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  /* 기획변화 (PDF) */
  .chgdoc{width:210mm;padding:18mm 16mm;background:#fff;font-size:11.5px;line-height:1.55}
  .chgdoc h1{font-size:24px;margin:0 0 2px}.chgdoc .lead{color:var(--muted);margin:0 0 14px}

function learnLanes(s,W=1000,sel=1){

  let g='';
  for(let m=0;m<=M;m+=5){const x=X(m),tot=h0*60+m0+m;g+=`<line x1="${x}" y1="${y.win}" x2="${x}" y2="${H-26}" stroke="#eef0f3"/><text x="${x}" y="${H-8}" font-size="11.5" fill="#6b7280" text-anchor="middle">${String(Math.floor(tot/60)).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}</text>`;}
  g+=lbl(y.win+17,'활성 창');

  g+=`<line x1="${L}" y1="${y.flow+18}" x2="${W-R}" y2="${y.flow+18}" stroke="#e5e7eb"/>`;
  s.flow.forEach((f,i)=>{const [ic,c]=FK[f.k],x=X(f.m),on=i===sel;g+=`<g${on?' opacity="1"':''}><circle cx="${x}" cy="${y.flow+18}" r="${on?13:10}" fill="${on?c:'#fff'}" stroke="${c}" stroke-width="${on?3:2}"/><text x="${x}" y="${y.flow+22.5}" font-size="${on?12:11}" font-weight="700" fill="${on?'#fff':c}" text-anchor="middle">${ic}</text></g>`;if(on)g+=`<rect x="${x-34}" y="${y.flow-6}" width="68" height="16" rx="8" fill="${c}"/><text x="${x}" y="${y.flow+6}" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">${f.t} ${FK[f.k][2]}</text>`;});
