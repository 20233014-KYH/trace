<rect width="1600" height="640" fill="#ffffff"/>
<text x="40" y="52" font-size="30" fill="#0b0b0b" font-weight="700" text-anchor="start">학생 설문 34명 — 켜는 이유는 바깥에서, 걸림돌은 감시</text>
<text x="40" y="84" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">2026.10 · 여러 개 고름 · 공학 · 컴퓨터 계열 18명, 2학년 19명으로 치우침 → 경향만</text>
