<text x="316" y="335" font-size="16" fill="#0b0b0b" font-weight="400" text-anchor="end">내가 먼저 보고 고를 수 있으면</text>
<path d="M330,314 L478.0,314 Q482.0,314 482.0,318 L482.0,340 Q482.0,344 478.0,344 L330,344 z" fill="#b9cfe9"/>
