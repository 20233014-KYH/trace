<text x="40" y="600" font-size="17" fill="#52514e" font-weight="400" text-anchor="start">→ 교수가 요구하는 길(B2B)로 시작하고, 학생 화면은 감시처럼 보이지 않게 (무엇이 기록되고 안 되는지 · 언제든 멈춤 · 보내기 전에 고름)</text>
